<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Events Portal - Event Details</title>
    <link rel="stylesheet" href="../src/output.css" />
    <link rel="stylesheet" href="../styles.css" />
    <script type="module" src="../Js/eventDetails.js" defer></script>
  </head>

  <body>
    <!-- Header -->
    <header>
      <nav>
        <h1 class="logo">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#ffffff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"
            ></path>
            <path d="M22 10v6"></path>
            <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path>
          </svg>
          UniEvents
        </h1>

        <ul class="nav-links">
          <li><a href="home.html" class="nav-link">Home</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="events.html" class="nav-link active">Events</a></li>
          <li><a href="calendar.html" class="nav-link">Calendar</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <a href="events.html" class="back-link">← Back to Events</a>

      <article id="eventDetailsContainer" class="event-details">
        <img
          id="eventImage"
          src="./assets/images/landscape-placeholder.svg"
          alt="Event banner"
          class="event-image"
        />

        <p id="eventType"></p>
        <h2 id="eventTitle"></h2>
        <br />
        <!-- Two Columns Info Grid -->
        <div class="info-grid">
          <div class="info-item">
            <div class="icon-box">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#0b1f3a"
                stroke-width="2"
              >
                <path
                  d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"
                ></path>
                <path d="M22 10v6"></path>
                <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path>
              </svg>
            </div>
            <div>
              <p class="label">University</p>
              <p id="eventUniversity"></p>
            </div>
          </div>

          <div class="info-item">
            <div class="icon-box">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#0b1f3a"
                stroke-width="2"
              >
                <path d="M8 2v4"></path>
                <path d="M16 2v4"></path>
                <rect width="18" height="18" x="3" y="4" rx="2"></rect>
                <path d="M3 10h18"></path>
              </svg>
            </div>
            <div>
              <p class="label">Date</p>
              <p id="eventDate"></p>
            </div>
          </div>

          <div class="info-item">
            <div class="icon-box">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#0b1f3a"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 6v6l4 2"></path>
              </svg>
            </div>
            <div>
              <p class="label">Time</p>
              <p id="eventTime"></p>
            </div>
          </div>

          <div class="info-item">
            <div class="icon-box">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#0b1f3a"
                stroke-width="2"
              >
                <path
                  d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"
                ></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </div>
            <div>
              <p class="label">Location</p>
              <p id="eventLocation"></p>
            </div>
          </div>
        </div>

        <hr />

        <!-- About Section -->
        <section>
          <h3 class="font-bold">About This Event</h3>
          <p id="eventDescription"></p>
          <hr />
        </section>

        <a class="primary-btn" id="registerBtn" href="register.html"
          >Register for This Event</a
        >
      </article>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2025 University Events Portal. All rights reserved.</p>
      <p>Connecting students across universities</p>
    </footer>
  </body>
</html>
