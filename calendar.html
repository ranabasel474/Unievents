<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Events Portal - My Calendar</title>
    <link rel="stylesheet" href="./src/output.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <!-- Header -->
    <header>
      <nav>
        <h1 class="logo">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="none"
            stroke="#ffffff"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path
              d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"
            ></path>
            <path d="M22 10v6"></path>
            <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path>
          </svg>
          UniEvents
        </h1>
        <ul class="nav-links">
          <li><a href="home.html" class="nav-link">Home</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="events.html" class="nav-link">Events</a></li>
          <li><a href="calendar.html" class="nav-link active">Calendar</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- General Section -->
    <section class="gen bg-gradient-to-r from-blue-900 to-teal-400">
      <h1 class="gen-title">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        My Calendar
      </h1>

      <p class="gen-subtitle">
        Keep track of your registered events in one convenient place.
      </p>
    </section>
    <!-- Main Content -->
    <main class="container">
      <h2 class="section-title">Select a Date</h2>
      <article class="white-card" style="text-align: center">
        <input
          type="date"
          id="calendar"
          name="calendar"
          class="calendar-input"
        />
      </article>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2025 University Events Portal. All rights reserved.</p>
      <p>Connecting students across universities</p>
    </footer>
  </body>
</html>
